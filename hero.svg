<!-- luminárias de jardim -->
<g fill="#ffd590"><circle cx="300" cy="900" r="3"/><circle cx="560" cy="905" r="3"/><circle cx="1040" cy="905" r="3"/><circle cx="1300" cy="900" r="3"/></g>
<g filter="url(#brilho)" fill="#ffc777" opacity=".5"><circle cx="300" cy="900" r="16"/><circle cx="560" cy="905" r="16"/><circle cx="1040" cy="905" r="16"/><circle cx="1300" cy="900" r="16"/></g>
</svg>
