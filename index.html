<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="lNpbYHTuL6ty-sMcQFFvKBq8Q_p2B0dbHsY_VbZLY_w" />

<meta property="og:type" content="website">
<meta property="og:title" content="Rosangela Oliveira Empreendimentos Imobiliários">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600;800&display=swap">
<style>
/* Site público: muito espaço em branco, busca em um bloco suave e imóveis sem molduras. */
:root{
  --bg:#fff;--panel:#fff;--soft:#e8ecf2;--fg:#0f1d33;--muted:#475467;--line:#cfd6e0;--ouro:#7d5a26;
  --accent:#1b3a6b;--on-accent:#fff;--danger:#b3362b;--ok:#17744a;--wait:#96610a;--aluga:#1d5fb8;
  --display:"Bricolage Grotesque","Segoe UI",sans-serif;--body:"Figtree","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--panel:#172437;--soft:#1e2e45;--fg:#f4f6fa;--muted:#c0cad8;--line:#3a4b64;--ouro:#d4ae6e;--danger:#ef8277;--ok:#62cf9c;--wait:#e8b65c;--aluga:#8bbcf5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a2b;--panel:#172437;--soft:#1e2e45;--fg:#f4f6fa;--muted:#c0cad8;--line:#3a4b64;--ouro:#d4ae6e;--danger:#ef8277;--ok:#62cf9c;--wait:#e8b65c;--aluga:#8bbcf5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
header{background:var(--bg)}
.bar{max-width:1180px;margin:auto;padding:20px 16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.tema{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.tema:hover{background:var(--soft)}
.topo{display:flex;gap:8px;align-items:center;flex:0 1 auto;margin-left:auto}
.links{display:grid;gap:6px}
.contato{padding:9px 14px;font-size:.88rem;white-space:nowrap;text-align:center}
#l-mapa{width:100%}
#l-mapa .map{height:min(60vh,460px)}
#l-mapa .hint{margin-top:8px}
.fale{display:grid;gap:14px;justify-items:start;padding-block:40px 72px}
.fale .lead{margin:0;font-size:1rem}
.fale p{margin:0}
.voltar{color:var(--muted);font-size:.9rem}
.btn.zap{background:#128c4a;border-color:#128c4a;color:#fff;padding:13px 22px;font-size:1rem}
.brand{cursor:pointer;min-width:0;flex:1 1 200px;font:600 clamp(1.8rem,3.4vw,2.25rem)/1.15 var(--body);display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.brand img{height:clamp(72px,8vw,96px);width:auto;flex:none;object-fit:contain}
.brand span{text-wrap:balance}
.creci{display:block;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;line-height:1.2;margin-top:2px}
#v-titulo{font-size:clamp(2rem,4vw,3rem);font-weight:800}
.wrap{max-width:1180px;margin:auto;padding:24px 16px 56px}
h1{font:600 clamp(2.2rem,5.5vw,3.8rem)/1.08 var(--body);letter-spacing:-.025em;max-width:16ch;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 1.4rem var(--body);letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.hero{color:var(--fg)}
.hero.foto{color:#fff;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),var(--banner) center/cover}
.hero .wrap{padding-block:48px 32px;display:grid;gap:8px}
.filtros{display:grid;grid-template-columns:2fr repeat(5,minmax(0,1fr));gap:12px;background:var(--accent);border-radius:16px;padding:16px;margin-bottom:28px}
.filtros label{color:#fff}
.filtros input,.filtros select{background:var(--panel)}
::placeholder{color:var(--muted);opacity:1}
label{display:grid;gap:4px;font-weight:500;font-size:.8rem;color:var(--muted);min-width:0;align-content:start}
input,select{width:100%;font:400 .95rem var(--body);color:var(--fg);background:var(--bg);border:1px solid transparent;border-radius:10px;padding:10px 12px}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:36px 24px}
.grid.lista{grid-template-columns:minmax(0,1fr)}
.casa{background:none;border:0;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer;display:grid;align-content:start;min-width:0}
.casa .pic{transition:transform .25s ease}
.casa:hover .pic{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.casa .pic{transition:none}.casa:hover .pic{transform:none}}
.grid.lista .casa{grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px}
.pic{background:var(--soft);object-fit:cover;width:100%;aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.casa-b{padding:12px 2px 0;display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tipo{font-size:.8rem;font-weight:500;color:var(--ouro)}
.valor{font:600 1.35rem var(--body);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tam{font-size:.92rem}
.st{font-size:.76rem;font-weight:500;white-space:nowrap}
.st.venda{color:var(--ok)}.st.aluga{color:var(--aluga)}.st.pendente{color:var(--wait)}.st.vendida{color:var(--danger)}
.meta{color:var(--muted);font-size:.92rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:10px;padding:10px 16px;font:500 .95rem var(--body);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:none;color:var(--fg);border-color:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.map{width:100%;height:260px;border:0;border-radius:14px;display:block}
.empty{padding:64px 12px;text-align:center;color:var(--muted);background:var(--soft);border-radius:16px;grid-column:1/-1}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:20px;color:var(--muted);font-size:.9rem;display:grid;gap:4px;overflow-wrap:anywhere}
#v-foot{display:grid;gap:4px}
#dev{justify-self:end;font-size:.7rem;color:var(--muted);opacity:.55;text-decoration:none}
#dev:hover,#dev:focus-visible{opacity:1;text-decoration:underline}
summary{cursor:pointer;font-weight:600}
#det{position:fixed;inset:0;z-index:8;background:rgba(15,26,43,.45);backdrop-filter:blur(4px);overflow:auto;padding:24px 16px}
.det-b{background:var(--panel);max-width:760px;margin:auto;border-radius:18px;padding:24px;display:grid;gap:12px;overflow-wrap:anywhere}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
#cookie{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;z-index:7;box-shadow:0 8px 28px rgba(15,26,43,.12)}
@media (max-width:820px){.links{display:flex;flex-wrap:wrap;justify-content:flex-end}.filtros{grid-template-columns:repeat(2,minmax(0,1fr))}.filtros label:first-child,.filtros label:last-child{grid-column:1/-1}.grid.lista .casa{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" id="brand"></div><div class="topo"><div class="links"><a class="btn contato" href="#contato">Entre em contato</a><a class="btn contato" href="#localizacao">Localização</a></div><button class="tema" id="tema" type="button"></button></div></div></header>

<main id="vitrine">
  <div class="hero" id="hero"><div class="wrap"><h1 id="v-titulo"></h1><div id="v-sobre"></div></div></div>
  <div class="wrap">
    <div class="filtros" id="filtros">
      <label>Bairro, cidade, CEP ou o que tem perto <input id="f-txt" placeholder="Ex.: metrô, Moema"></label>
      <label>Código do imóvel <input id="f-cod" autocomplete="off"></label>
      <label>Tipo <select id="f-tipo"></select></label>
      <label>Valor mínimo <select id="f-min"><option value="">Qualquer</option><option value="800">R$ 800</option><option value="2000">R$ 2 mil</option><option value="5000">R$ 5 mil</option><option value="100000">R$ 100 mil</option><option value="300000">R$ 300 mil</option><option value="500000">R$ 500 mil</option><option value="800000">R$ 800 mil</option><option value="1200000">R$ 1,2 milhão</option><option value="2000000">R$ 2 milhões</option></select></label>
      <label>Tamanho mínimo <select id="f-m"><option value="">Qualquer</option><option value="50">50 m²</option><option value="100">100 m²</option><option value="150">150 m²</option><option value="250">250 m²</option></select></label>
      <label>Situação <select id="f-st"><option value="">Disponíveis</option><option>À venda</option><option>Para alugar</option><option>Pendente</option><option>Vendida</option></select></label>
    </div>
    <p class="lead" id="v-total"></p>
    <div class="grid" id="v-grid"></div>
  </div>
</main>
<section id="tela-contato" hidden><div class="wrap fale">
  <a class="voltar" href="#">&larr; Voltar aos imóveis</a>
  <h1>Entre em contato</h1>
  <p class="lead" id="c-texto"></p>
  <a class="btn zap" id="c-zap" target="_blank" rel="noopener" hidden>Chamar no WhatsApp</a>
  <p id="c-numeros"></p>
</div></section>
<section id="tela-localizacao" hidden><div class="wrap fale">
  <a class="voltar" href="#">&larr; Voltar aos imóveis</a>
  <h1>Nossa localização</h1>
  <p class="lead" id="l-end"></p>
  <div id="l-mapa"></div>
</div></section>
<footer><div class="wrap"><div id="v-foot"></div><a id="dev" href="login.html" hidden>Área do desenvolvedor</a></div></footer>

<div id="det" hidden></div>
<div id="cookie" hidden><div>Este site usa cookies para funcionar melhor.</div><div class="acts"><button class="btn" id="cookie-ok" type="button">Entendi</button></div></div>

<script src="dados.js"></script>
<script src="nuvem.js"></script>
<script>
var TIPOS=['Casa','Apartamento','Sobrado','Cobertura','Terreno','Chácara','Sala comercial'];
var D=window.DADOS||{},C=D.cfg||{},CASAS=[],carregou=false,COOKIE='imobiliaria-cookie';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
var stClass=function(s){return s==='Vendida'?'vendida':s==='Pendente'?'pendente':s==='Para alugar'?'aluga':'venda'};
var valor=function(h){return money(h.preco)+(h.status==='Para alugar'?' /mês':'')};
var pic=function(h){return h.fotos[0]?'<img class="pic" alt="" src="'+esc(h.fotos[0])+'">':'<div class="pic">Sem foto</div>'};
var conta=function(n,um,varios){return n===''||n==null?'':n+' '+(+n===1?um:varios)};
var extras=function(h){return[conta(h.q,'quarto','quartos'),conta(h.b,'banheiro','banheiros'),conta(h.v,'vaga','vagas')].filter(Boolean).join(' · ')};
var semAcento=function(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var etiquetas=function(h){return'<div class="top"><span class="tipo">'+esc(h.tipo)+(h.cod?' · Cód. '+esc(h.cod):'')+'</span><span class="st '+stClass(h.status)+'">'+esc(h.status)+'</span></div>'};
function mapHtml(end,cep){var q=encodeURIComponent([end,cep,'Brasil'].filter(Boolean).join(', '));
  return'<iframe class="map" title="Mapa de '+esc(end)+'" loading="lazy" src="https://www.google.com/maps?q='+q+'&output=embed"></iframe><p class="hint"><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">Abrir no Google Maps</a></p>'}

function ordenadas(){var l=CASAS.slice();
  if(C.ordem==='menor')l.sort(function(a,b){return a.preco-b.preco});
  else if(C.ordem==='maior')l.sort(function(a,b){return b.preco-a.preco});
  else l.sort(function(a,b){return b.id-a.id});return l}

/* Ordem do site: venda e aluguel intercalados e, por último, os pendentes. */
function intercalar(l){var por=function(s){return l.filter(function(h){return h.status===s})},v=por('À venda'),a=por('Para alugar'),o=[];
  while(v.length||a.length){if(v.length)o.push(v.shift());if(a.length)o.push(a.shift())}
  return o.concat(l.filter(function(h){return h.status!=='À venda'&&h.status!=='Para alugar'}))}

function mostrar(){
  var l=ordenadas(),t=semAcento($('f-txt').value.trim()),tp=$('f-tipo').value,vm=+$('f-min').value,mn=+$('f-m').value,st=$('f-st').value,cod=$('f-cod').value.trim().toUpperCase();
  if(C.busca)l=l.filter(function(h){return(!t||semAcento(h.tipo+' '+h.titulo+' '+h.end+' '+h.perto+' '+h.cep+' '+String(h.cep||'').replace('-','')).indexOf(t)>=0)&&(!tp||h.tipo===tp)&&(!vm||h.preco>=vm)&&(!mn||+h.m>=mn)&&(!st||h.status===st)&&(!cod||String(h.cod||'').trim().toUpperCase()===cod)});
  if(st!=='Vendida')l=l.filter(function(h){return h.status!=='Vendida'});
  l=intercalar(l);
  $('v-total').textContent=l.length===1?'1 imóvel encontrado':l.length+' imóveis encontrados';
  var g=$('v-grid');g.className='grid'+(C.layout==='lista'?' lista':'');
  g.innerHTML=l.length?l.map(function(h){return'<button class="casa" type="button" data-ver="'+h.id+'">'+pic(h)+'<div class="casa-b">'+etiquetas(h)+'<div class="valor">'+valor(h)+'</div><div class="tam">'+(h.m?esc(String(h.m).replace('.',','))+' m²':'Tamanho não informado')+'</div><div>'+esc(h.end)+'</div>'+(h.perto?'<div class="meta">Perto de: '+esc(h.perto)+'</div>':'')+'</div></button>'}).join(''):'<div class="empty">'+(!carregou?'Carregando imóveis...':CASAS.length?'Nenhum imóvel encontrado. Tente ampliar a busca.':'Ainda não há imóveis cadastrados.')+'</div>';
}

function tipos(){var s=$('f-tipo'),v=s.value;
  s.innerHTML='<option value="">Todos</option>'+TIPOS.concat(CASAS.map(function(h){return h.tipo})).filter(function(t,i,l){return l.indexOf(t)===i}).map(function(t){return'<option>'+esc(t)+'</option>'}).join('');
  s.value=v;if(s.selectedIndex<0)s.value=''}

/* Botão de tema: lembra a escolha do visitante neste navegador. */
var TEMA='imobiliaria-tema';
var LUA='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SOL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function escuro(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function iconeTema(){var e=escuro();$('tema').innerHTML=e?SOL:LUA;$('tema').setAttribute('aria-label',e?'Ativar modo claro':'Ativar modo escuro')}
$('tema').addEventListener('click',function(){var t=escuro()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(TEMA,t)}catch(e){}iconeTema()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',iconeTema);

function iniciar(){
  var r=document.documentElement,hero=$('hero');
  if(C.cor)r.style.setProperty('--accent',C.cor);
  var salvo=null;try{salvo=localStorage.getItem(TEMA)}catch(e){}
  if(salvo||C.tema)r.setAttribute('data-theme',salvo||C.tema);
  iconeTema();  $('brand').innerHTML=(C.logo?'<img alt="" src="'+esc(C.logo)+'">':'')+'<span>'+esc(C.nome||'Procurar imóveis')+'<span class="creci">Creci J 11265</span></span>';
  document.title=C.seot||C.nome||'Procurar imóveis';
  if(C.seod){var md=document.querySelector('meta[name=description]');if(!md){md=document.createElement('meta');md.name='description';document.head.appendChild(md)}md.content=C.seod}
  if(C.logo){var ic=document.createElement('link');ic.rel='icon';ic.href=C.logo;document.head.appendChild(ic)}
  hero.classList.toggle('foto',!!C.banner);if(C.banner)hero.style.setProperty('--banner','url("'+C.banner+'")');
  $('v-titulo').textContent=C.slogan||'Procurar imóveis';$('v-sobre').textContent=C.apoio||'';
  $('filtros').hidden=!C.busca;
  tipos();
  $('v-foot').innerHTML='<strong>'+esc(C.nome)+(C.creci?' · CRECI '+esc(C.creci):'')+'</strong>'+(C.sobre?'<div>'+esc(C.sobre)+'</div>':'')+'<div>'+[C.tel,C.zap&&'WhatsApp '+C.zap,C.email,C.horario,C.end,C.insta,C.face].filter(Boolean).map(esc).join(' · ')+'</div>'+(C.priv?'<details><summary>Política de privacidade</summary>'+esc(C.priv)+'</details>':'');
  if(window.DADOS)mostrar();
  else{$('filtros').hidden=true;$('v-grid').innerHTML='<div class="empty">Não foi possível carregar os imóveis. Tente de novo em instantes.</div>'}
  var visto=false;try{visto=localStorage.getItem(COOKIE)==='1'}catch(e){}
  $('cookie').hidden=!C.cookies||visto;
}

['f-txt','f-cod','f-tipo','f-min','f-m','f-st'].forEach(function(i){$(i).addEventListener('input',mostrar)});

/* Tela Entre em contato */
function preencheContato(){var zap=(C.zap||'').replace(/\D/g,''),z=$('c-zap');
  z.hidden=!zap;if(zap)z.href='https://wa.me/55'+zap+'?text='+encodeURIComponent('Olá! Vim pelo site e gostaria de falar sobre um imóvel.');
  $('c-texto').textContent=zap?'Fale com a gente pelo WhatsApp.':C.tel||C.email?'Fale com a gente pelos contatos abaixo.':'Nossos contatos serão publicados em breve.';
  $('c-numeros').textContent=[C.zap&&'WhatsApp '+C.zap,C.tel&&'Telefone '+C.tel,C.email].filter(Boolean).join(' · ')}
/* O mapa só carrega quando a tela Localização é aberta. */
var ENDERECO='Rua Pernambuco, 2471-B, Paranavaí - PR';
function telas(){var c=location.hash==='#contato',l=location.hash==='#localizacao';$('vitrine').hidden=c||l;$('tela-contato').hidden=!c;$('tela-localizacao').hidden=!l;
  if(l&&!$('l-mapa').firstChild){$('l-end').textContent=ENDERECO;$('l-mapa').innerHTML=mapHtml(ENDERECO)}
  window.scrollTo(0,0)}
window.addEventListener('hashchange',telas);
$('brand').addEventListener('click',function(){location.hash='';window.scrollTo(0,0)});

/* Mensagem pronta para o cliente enviar pelo WhatsApp, com os dados do imóvel. */
function mensagem(h){var desc=String(h.desc||'').trim();
  var linhas=[h.cod&&'Código: '+h.cod,'Imóvel: '+h.titulo,'Tipo: '+h.tipo,'Valor: '+valor(h),h.m&&'Tamanho: '+String(h.m).replace('.',',')+' m²',extras(h)&&'Detalhes: '+extras(h),'Localização: '+h.end,h.cep&&'CEP: '+h.cep,h.perto&&'Perto de: '+h.perto,desc&&'Descrição: '+(desc.length>200?desc.slice(0,200)+'...':desc),'Situação: '+h.status].filter(Boolean);
  return'Olá! Tenho interesse neste imóvel:\n\n'+linhas.join('\n')+'\n\nPodemos nos encontrar no imóvel ou posso agendar um horário com você no seu escritório?'}

/* Detalhe do imóvel */
var origem=null;
function fechar(){if($('det').hidden)return;$('det').hidden=true;document.body.style.overflow='';if(origem)origem.focus()}
$('v-grid').addEventListener('click',function(e){var b=e.target.closest('[data-ver]');if(!b)return;
  var h=CASAS.find(function(x){return x.id==b.dataset.ver}),zap=(C.zap||'').replace(/\D/g,'');
  var msg=encodeURIComponent(mensagem(h));
  origem=b;
  $('det').innerHTML='<div class="det-b" role="dialog" aria-modal="true" aria-label="'+esc(h.titulo)+'" tabindex="-1">'+etiquetas(h)+'<h2>'+esc(h.titulo)+'</h2><div class="valor">'+valor(h)+'</div><div class="tam">'+(h.m?esc(String(h.m).replace('.',','))+' m²':'')+(h.m&&extras(h)?' · ':'')+esc(extras(h))+'</div><div>'+esc(h.end)+(h.cep?' · CEP '+esc(h.cep):'')+'</div>'+(h.perto?'<div class="meta">Perto de: '+esc(h.perto)+'</div>':'')+(h.desc?'<p style="margin:0;white-space:pre-line">'+esc(h.desc)+'</p>':'')+
  (h.fotos.length?'<div class="galeria">'+h.fotos.map(function(u){return'<img class="pic" alt="" src="'+esc(u)+'">'}).join('')+'</div>':'')+(C.mapa?mapHtml(h.end,h.cep):'')+
  (C.tel?'<div>Telefone: <strong>'+esc(C.tel)+'</strong></div>':'')+'<div class="acts">'+(C.agendar&&zap&&h.status!=='Vendida'?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/55'+zap+'?text='+msg+'">Entre em contato</a>':'')+'<button class="btn alt" id="fechar" type="button">Fechar</button></div></div>';
  $('det').hidden=false;document.body.style.overflow='hidden';$('det').scrollTop=0;$('det').firstChild.focus()});
$('det').addEventListener('click',function(e){if(e.target.id==='det'||e.target.id==='fechar')fechar()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar()});
$('cookie-ok').addEventListener('click',function(){$('cookie').hidden=true;try{localStorage.setItem(COOKIE,'1')}catch(e){}});

/* Busca os imóveis no Supabase e mostra as novidades sem recarregar a página. */
var ultimo=null;
function conferir(){nuvemImoveis().then(function(l){var n=JSON.stringify(l);carregou=true;if(n===ultimo)return;
  ultimo=n;CASAS=l;tipos();mostrar()}).catch(function(){
  if(!carregou)$('v-grid').innerHTML='<div class="empty">Não foi possível carregar os imóveis. Tente de novo em instantes.</div>'})}

iniciar();
preencheContato();telas();
conferir();setInterval(conferir,30000);

/* O desenvolvedor logado ganha o atalho para o cadastro. */
$('dev').hidden=false;if(nuvemSessao()){$('dev').textContent='Cadastro de imóvel';$('dev').href='admin.html'}
</script>
