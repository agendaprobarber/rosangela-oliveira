<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cadastro de imóvel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Painel do desenvolvedor: grava os imóveis no Supabase, de onde o site público lê. */
:root{
  --bg:#f7f4ed;--panel:#fff;--fg:#16233a;--muted:#5d6472;--line:#e0d9c8;--ouro:#8a6530;
  --accent:#1b3a6b;--on-accent:#fff;--danger:#b3362b;
  --display:"Bricolage Grotesque","Segoe UI",sans-serif;--body:"Figtree","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--panel:#172437;--fg:#eef1f6;--muted:#a7b3c4;--line:#2c3b52;--ouro:#d4ae6e;--danger:#ef8277;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a2b;--panel:#172437;--fg:#eef1f6;--muted:#a7b3c4;--line:#2c3b52;--ouro:#d4ae6e;--danger:#ef8277;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
header{background:var(--panel);border-bottom:2px solid var(--ouro);position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.brand{font:700 1.15rem var(--display);overflow-wrap:anywhere;display:flex;gap:10px;align-items:center}
.brand img{height:40px;width:auto;max-width:70px;object-fit:contain}
.wrap{max-width:1180px;margin:auto;padding:24px 16px 56px}
h1{font:700 clamp(1.8rem,5vw,2.8rem)/1.1 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.lead{color:var(--muted);margin:0 0 20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
details.box{margin-bottom:12px}
summary{padding:14px 18px;cursor:pointer;font:700 1.1rem var(--display)}
.in{padding:4px 18px 18px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem;min-width:0;align-content:start}
input,select,textarea{width:100%;font:400 1rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.hint{color:var(--muted);font-size:.85rem;font-weight:400;margin:0}
.hint:empty{display:none}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:6px;padding:9px 14px;font:600 .95rem var(--body);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:none;color:var(--fg);border-color:var(--line)}
.btn.del{background:none;color:var(--danger);border-color:var(--danger)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.map{width:100%;height:260px;border:1px solid var(--line);border-radius:6px;display:block}
.empty{padding:32px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;line-height:0}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:3px}
#ver-fotos img{width:160px;height:120px}
.mais-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.filtro{display:grid;grid-template-columns:110px 100px;gap:10px;justify-content:start}
.filtro label{font-size:.78rem;white-space:nowrap}
.filtro input,.filtro select{font-size:.85rem;padding:5px 8px;height:28px}
#h-cod{color:var(--muted);cursor:default}
.filtro select{padding:2px 4px}
#baixar-planilha{margin-left:auto}
.mais{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font:500 2.2rem/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0 0 4px}
.adm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);border-left:4px solid transparent;border-radius:8px;cursor:pointer;transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.adm:hover,.adm:focus-within{background:color-mix(in srgb,var(--ouro) 14%,var(--panel));border-left-color:var(--ouro);transform:translateX(4px);box-shadow:0 2px 10px rgba(15,26,43,.14)}
.adm.sel{background:color-mix(in srgb,var(--ouro) 24%,var(--panel));border-left-color:var(--ouro);box-shadow:inset 0 0 0 1px var(--ouro)}
@media (prefers-reduced-motion:reduce){.adm:hover,.adm:focus-within{transform:none}}
.adm:first-child{border-top:0}
.ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 20px;margin:0}
.ficha dt{color:var(--muted);font-size:.8rem}
.ficha dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.ficha .largo{grid-column:1/-1}
.adm strong{display:block;overflow-wrap:anywhere}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:9}
@media (max-width:820px){.adm{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="brand"></div>
  <div class="acts"><a class="btn alt" href="index.html" target="_blank" rel="noopener">Ver site público</a><button class="btn alt" id="sair" type="button">Sair</button></div>
</div></header>

<main>
<section id="config" hidden><div class="wrap">
  <h1 style="margin-bottom:20px">Cadastro de imóvel</h1>

  <details class="box" open><summary>Imóveis: cadastro e situação</summary><div class="in">
    <div class="filtro"><label>Buscar por código <input id="filtro-cod" autocomplete="off"></label>
    <label>Filtrar por situação <select id="filtro-st"><option value="">Todas</option><option>À venda</option><option>Para alugar</option><option>Pendente</option><option>Vendida</option></select></label></div>
    <div id="adm"></div>
    <div class="mais-row"><button class="mais" id="nova-casa" type="button" aria-label="Adicionar novo imóvel">+</button><span class="hint">Adicionar imóvel</span><button class="btn alt" id="baixar-planilha" type="button">Baixar planilha</button></div>
  </div></details>
</div></section>

<section id="casa" hidden><div class="wrap">
  <button class="btn alt" id="h-voltar" type="button">&larr; Voltar</button>
  <h1 id="fh-title" style="margin-top:14px">Novo imóvel</h1>
  <p class="lead">Preencha os dados do imóvel.</p>
  <form id="fh" class="box in" style="padding-top:18px">
    <label>Código do imóvel (automático) <input id="h-cod" readonly tabindex="-1" autocomplete="off"></label>
    <label>Nome do anúncio <input id="h-titulo" required placeholder="Ex.: Casa com quintal no Jardim das Flores"></label>
    <div class="row">
      <label>Tipo <select id="h-tipo"></select></label>
      <label>Valor (R$) <input id="h-preco" required inputmode="numeric" placeholder="650.000"></label>
      <label>Tamanho (m²) <input id="h-m" type="number" min="1" step="any" required></label>
      <label>Situação <select id="h-status"><option>À venda</option><option>Para alugar</option><option>Pendente</option><option>Vendida</option></select></label>
    </div>
    <div class="row">
      <label>CEP <input id="h-cep" inputmode="numeric" autocomplete="off" placeholder="00000-000"></label>
      <label>Número <input id="h-num" disabled placeholder="Preencha o CEP"></label>
    </div>
    <p class="hint" id="h-cep-msg" role="status"></p>
    <label>Localização <input id="h-end" required placeholder="Rua, número, bairro, cidade"></label>
    <div id="h-map"></div>
    <label>Perto de <input id="h-perto" placeholder="Ex.: metrô Santa Cruz, Colégio Objetivo, mercado"></label>
    <div class="row">
      <label>Quartos <input id="h-q" type="number" min="0"></label>
      <label>Banheiros <input id="h-b" type="number" min="0"></label>
      <label>Vagas <input id="h-v" type="number" min="0"></label>
    </div>
    <label>Descrição <textarea id="h-desc" rows="3"></textarea></label>
    <label>Fotos <input id="h-fotos" type="file" accept="image/*" multiple></label>
    <div class="thumbs" id="h-thumbs"></div>
    <div class="acts">
      <button class="btn" type="submit" id="h-salvar">Adicionar imóvel</button>
      <button class="btn alt" type="button" id="h-cancelar">Cancelar</button>
    </div>
  </form>
</div></section>

<section id="ver" hidden><div class="wrap">
  <button class="btn alt" id="ver-voltar" type="button">&larr; Voltar</button>
  <h1 id="ver-titulo" style="margin-top:14px"></h1>
  <p class="lead">Somente para consulta. Para alterar, use Editar na lista.</p>
  <div class="box in" style="padding-top:18px">
    <dl class="ficha" id="ver-dados"></dl>
    <div class="thumbs" id="ver-fotos"></div>
    <div id="ver-mapa"></div>
  </div>
</div></section>
</main>

<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="dados.js"></script>
<script src="nuvem.js"></script>
<script>
var TIPOS=['Casa','Apartamento','Sobrado','Cobertura','Terreno','Chácara','Sala comercial'];
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};

/* Os imóveis vêm do Supabase ao abrir o painel; o dados.js guarda só a aparência do site. */
var state={cfg:(window.DADOS||{}).cfg||{},houses:[]},C=state.cfg;

function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3500)}
function falhou(e,msg){
  if(e&&e.sessao){toast('Sua sessão terminou. Entre de novo.');setTimeout(function(){location.replace('login.html')},2000);return}
  toast(e&&e.status===403?'Esta conta não tem permissão para alterar os imóveis.':msg)}

function mapHtml(q){var u=encodeURIComponent(q+', Brasil');
  return'<iframe class="map" title="Mapa de '+esc(q)+'" src="https://www.google.com/maps?q='+u+'&output=embed"></iframe><p class="hint"><a href="https://www.google.com/maps/search/?api=1&query='+u+'" target="_blank" rel="noopener">Abrir no Google Maps</a></p>'}
function drawMap(end,cep){var b=$('h-map'),q=[(end||'').trim(),cep].filter(Boolean).join(', ');
  if(b.dataset.q===q&&b.firstChild)return;b.dataset.q=q;b.innerHTML=q.length<5?'<p class="hint">Digite o CEP ou o endereço para ver no Google Maps.</p>':mapHtml(q)}
var debounce=function(f,ms){var t;return function(){clearTimeout(t);t=setTimeout(f,ms)}};
var mapH=debounce(function(){drawMap($('h-end').value,$('h-cep').value)},700);

function sorted(){var l=state.houses.slice();
  if(C.ordem==='menor')l.sort(function(a,b){return a.preco-b.preco});
  else if(C.ordem==='maior')l.sort(function(a,b){return b.preco-a.preco});
  else l.sort(function(a,b){return b.id-a.id});return l}
var codigo=function(c){return String(c||'').trim().toUpperCase()};
function codigoUsado(c){return state.houses.some(function(x){return codigo(x.cod)===codigo(c)})}
/* Começa em 1000 para não perder o zero à esquerda na planilha. */
function novoCodigo(){var c;do{c=String(1000+Math.floor(Math.random()*9000))}while(codigoUsado(c));return c}
function visiveis(){var f=$('filtro-st').value,c=codigo($('filtro-cod').value);return sorted().filter(function(h){return(!f||h.status===f)&&(!c||codigo(h.cod)===c)})}
var selecionado=null;
function renderAdm(){
  var l=visiveis(),f=[$('filtro-st').value,codigo($('filtro-cod').value)&&'código '+$('filtro-cod').value.trim()].filter(Boolean).join(', ');$('baixar-planilha').textContent=f?'Baixar planilha: '+f:'Baixar planilha';
  $('adm').innerHTML=l.length?l.map(function(h){return'<div class="adm'+(h.id===selecionado?' sel':'')+'" data-id="'+h.id+'"><div><strong>'+esc(h.titulo)+'</strong><span class="hint">'+(h.cod?'Cód. '+esc(h.cod)+' · ':'Sem código · ')+esc(h.tipo)+' · '+money(h.preco)+(h.m?' · '+esc(String(h.m).replace('.',','))+' m²':'')+'</span></div><div class="acts"><button class="btn alt" type="button" data-ver="'+h.id+'">Visualizar</button><button class="btn alt" type="button" data-edit="'+h.id+'">Editar</button><button class="btn del" type="button" data-del="'+h.id+'">Excluir</button></div></div>'}).join(''):'<div class="empty">'+(state.houses.length?'Nenhum imóvel com esse filtro.':'Nenhum imóvel cadastrado. Aperte o + para adicionar o primeiro.')+'</div>';
}

if(C.cor)document.documentElement.style.setProperty('--accent',C.cor);
/* Usa o mesmo tema escolhido no site público, inclusive se ele mudar com o painel aberto. */
function aplicaTema(){var s=null,r=document.documentElement;try{s=localStorage.getItem('imobiliaria-tema')}catch(e){}
  if(s||C.tema)r.setAttribute('data-theme',s||C.tema);else r.removeAttribute('data-theme')}
aplicaTema();
window.addEventListener('storage',function(e){if(e.key==='imobiliaria-tema')aplicaTema()});
$('brand').innerHTML=(C.logo?'<img alt="" src="'+esc(C.logo)+'">':'')+esc(C.nome||'Painel do site');
$('h-tipo').innerHTML=TIPOS.map(function(t){return'<option>'+t+'</option>'}).join('');

/* Visualizar: mostra todos os dados do imóvel, sem nenhum campo editável. */
function verImovel(id){var h=state.houses.find(function(x){return x.id==id});
  var d=h.id>1e12?new Date(h.id).toLocaleDateString('pt-BR'):'';
  var dados=[['Código',h.cod],['Tipo',h.tipo],['Valor',money(h.preco)],['Tamanho',h.m?String(h.m).replace('.',',')+' m²':''],['Situação',h.status],['Quartos',h.q],['Banheiros',h.b],['Vagas',h.v],['CEP',h.cep],['Número',h.num],['Cadastrado em',d],['Localização',h.end,1],['Perto de',h.perto,1],['Descrição',h.desc,1]];
  $('ver-titulo').textContent=h.titulo;
  $('ver-dados').innerHTML=dados.map(function(l){return'<div'+(l[2]?' class="largo"':'')+'><dt>'+l[0]+'</dt><dd>'+(l[1]===''||l[1]==null?'Não informado':esc(l[1]))+'</dd></div>'}).join('');
  $('ver-fotos').innerHTML=h.fotos.map(function(u){return'<img alt="" src="'+esc(u)+'">'}).join('');
  go('ver');
  $('ver-mapa').innerHTML=mapHtml([h.end,h.cep].filter(Boolean).join(', '))}
$('ver-voltar').addEventListener('click',function(){go('config')});

/* Reduz as imagens antes de enviar, para o site carregar rápido. */
function shrink(file,max,type){return new Promise(function(ok,no){
  var r=new FileReader();r.onerror=no;r.onload=function(){var i=new Image();i.onerror=no;i.onload=function(){
    var s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    ok(c.toDataURL(type,.72))};i.src=r.result};r.readAsDataURL(file)})}

/* CEP: o ViaCEP devolve o endereço, e o número entra nele enquanto a localização não for editada à mão. */
var cepSeq=0,cepInfo=null,cepRuim=false,autoEnd='';
function setCep(info){cepInfo=info;$('h-num').disabled=!info;$('h-num').placeholder=info?'Ex.: 120':'Preencha o CEP'}
function aplicaEnd(){autoEnd=[cepInfo.rua,$('h-num').value.trim(),cepInfo.resto].filter(Boolean).join(', ');$('h-end').value=autoEnd}
$('h-cep').addEventListener('input',function(){
  var d=this.value.replace(/\D/g,'').slice(0,8),seq=++cepSeq,msg=$('h-cep-msg');
  this.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;
  setCep(null);cepRuim=false;$('h-num').value='';
  if(d.length<8){msg.textContent='';return}
  var cep=this.value,ctl=new AbortController(),limite=setTimeout(function(){ctl.abort()},8000);
  msg.textContent='Buscando o endereço...';
  fetch('https://viacep.com.br/ws/'+d+'/json/',{signal:ctl.signal}).then(function(r){if(!r.ok)throw new Error('cep');return r.json()}).then(function(v){
    clearTimeout(limite);if(seq!==cepSeq)return;
    if(v.erro){cepRuim=true;
      if(autoEnd&&$('h-end').value===autoEnd){$('h-end').value='';autoEnd='';drawMap('','')}
      msg.textContent='CEP não encontrado. Confira os números ou apague o CEP e digite o endereço abaixo.';return}
    var resto=[v.bairro,v.localidade+' - '+v.uf].filter(Boolean).join(', ');
    if(!v.logradouro){autoEnd=resto;$('h-end').value=resto;drawMap(resto,cep);
      msg.textContent='Este CEP vale para a cidade inteira. Complete a localização com a rua e o número.';$('h-end').focus();return}
    setCep({rua:v.logradouro,resto:resto});
    aplicaEnd();drawMap(autoEnd,cep);msg.textContent='Endereço encontrado. Confira e informe o número.';$('h-num').focus();
  }).catch(function(){clearTimeout(limite);if(seq!==cepSeq)return;
    msg.textContent='Não consegui buscar o endereço agora. Confira a localização abaixo ou digite o endereço.';drawMap($('h-end').value,cep)});
});
$('h-num').addEventListener('input',function(){if(cepInfo){aplicaEnd();mapH()}});
$('h-end').addEventListener('input',function(){if(cepInfo&&this.value!==autoEnd)setCep(null);mapH()});

var editing=null,fotos=[],salvando=false;
/* Envia só as fotos novas; as que já estão no Supabase seguem como estão. */
function enviaFotos(lista,id){return Promise.all(lista.map(function(u,i){
  return u.indexOf('data:')===0?nuvemFoto(u,id+'-'+Date.now()+'-'+i+'.jpg'):u}))}
function thumbs(){$('h-thumbs').innerHTML=fotos.map(function(u,i){return'<button type="button" data-foto="'+i+'" aria-label="Remover foto '+(i+1)+'"><img alt="" src="'+u+'"></button>'}).join('')}
function resetForm(){$('fh').reset();editing=null;fotos=[];cepSeq++;autoEnd='';cepRuim=false;setCep(null);$('h-cep-msg').textContent='';thumbs();drawMap('','');$('fh-title').textContent='Novo imóvel';$('h-salvar').textContent='Adicionar imóvel'}
$('nova-casa').addEventListener('click',function(){if(editing)resetForm();go('casa')});
$('h-voltar').addEventListener('click',function(){go('config')});
$('h-cancelar').addEventListener('click',function(){resetForm();go('config')});
$('h-preco').addEventListener('input',function(){var d=this.value.replace(/\D/g,'');this.value=d?Number(d).toLocaleString('pt-BR'):''});
$('h-fotos').addEventListener('change',function(){var input=this;
  Promise.all([].map.call(input.files,function(f){return shrink(f,1000,'image/jpeg')})).then(function(l){fotos=fotos.concat(l);thumbs();input.value=''}).catch(function(){toast('Uma das fotos não pôde ser lida. Use JPG ou PNG.')})});
$('h-thumbs').addEventListener('click',function(e){var b=e.target.closest('[data-foto]');if(b){fotos.splice(+b.dataset.foto,1);thumbs()}});
$('fh').addEventListener('submit',function(e){e.preventDefault();
  var preco=Number($('h-preco').value.replace(/\D/g,''));
  if(!preco){toast('Informe o valor do imóvel.');return}
  var cod=$('h-cod').value.trim();
  if(!$('h-titulo').value.trim()||!$('h-end').value.trim()){toast('Preencha o nome do anúncio e a localização.');return}
  if(!cod||(!editing&&codigoUsado(cod)))cod=novoCodigo();
  var cepD=$('h-cep').value.replace(/\D/g,'');
  if(cepRuim||(cepD&&cepD.length<8)){toast('Corrija o CEP ou apague esse campo antes de salvar.');$('h-cep').focus();return}
  var data={cod:cod,titulo:$('h-titulo').value.trim(),tipo:$('h-tipo').value,preco:preco,status:$('h-status').value,q:$('h-q').value,b:$('h-b').value,v:$('h-v').value,m:$('h-m').value,cep:$('h-cep').value,num:$('h-num').value.trim(),cepInfo:cepInfo,end:$('h-end').value.trim(),perto:$('h-perto').value.trim(),desc:$('h-desc').value.trim()};
  if(salvando)return;
  var era=editing,id=era||Date.now(),antes=era?state.houses.find(function(x){return x.id===era}):null,botao=$('h-salvar'),rotulo=botao.textContent;
  salvando=true;botao.disabled=true;botao.textContent='Salvando...';
  enviaFotos(fotos,id).then(function(l){data.fotos=l;return nuvemGrava(id,data)}).then(function(){
    var sobra=antes?antes.fotos.filter(function(u){return data.fotos.indexOf(u)<0}):[];
    if(antes)Object.assign(antes,data);else{data.id=id;state.houses.push(data)}
    nuvemApagaFotos(sobra);
    toast(era?'Imóvel atualizado.':'Imóvel adicionado.');resetForm();renderAdm();go('config')
  }).catch(function(e){botao.textContent=rotulo;falhou(e,'Não consegui salvar. Confira a internet e tente de novo.')}).then(function(){salvando=false;botao.disabled=false})});
$('adm').addEventListener('click',function(e){
  var ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]'),ver=e.target.closest('[data-ver]'),linha=e.target.closest('.adm');
  if(linha){selecionado=+linha.dataset.id;[].forEach.call($('adm').querySelectorAll('.adm'),function(l){l.classList.toggle('sel',l===linha)})}
  if(ver)verImovel(ver.dataset.ver);
  if(ed){var h=state.houses.find(function(x){return x.id==ed.dataset.edit});editing=h.id;fotos=h.fotos.slice();cepSeq++;cepRuim=false;
    ['cod','titulo','tipo','status','q','b','v','m','cep','num','end','perto','desc'].forEach(function(k){$('h-'+k).value=h[k]});
    $('h-preco').value=h.preco.toLocaleString('pt-BR');setCep(h.cepInfo||null);autoEnd=h.end;$('h-cep-msg').textContent='';
    thumbs();drawMap(h.end,h.cep);$('fh-title').textContent='Editar imóvel';$('h-salvar').textContent='Salvar alterações';go('casa')}
  if(del){if(del.dataset.sure){var alvo=state.houses.find(function(x){return x.id==del.dataset.del});del.disabled=true;
      nuvemExclui(alvo.id).then(function(){
        state.houses=state.houses.filter(function(x){return x!==alvo});if(editing===alvo.id)resetForm();
        nuvemApagaFotos(alvo.fotos);renderAdm()
      }).catch(function(e){del.disabled=false;falhou(e,'Não consegui excluir. Confira a internet e tente de novo.')})}
    else{del.dataset.sure='1';del.textContent='Confirmar exclusão'}}
});

var XLSX_TIPO='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function planilha(lista){if(!window.XLSX)return null;
  var num=function(v){return v===''||v==null?'':Number(v)},cols=['Código','Nome do anúncio','Tipo','Valor (R$)','Tamanho (m²)','CEP','Número','Localização','Perto de','Quartos','Banheiros','Vagas','Situação','Descrição','Fotos','Cadastrado em'];
  var linhas=(lista||state.houses).slice().sort(function(a,b){return a.id-b.id}).map(function(h){return[h.cod,h.titulo,h.tipo,h.preco,num(h.m),h.cep,h.num,h.end,h.perto,num(h.q),num(h.b),num(h.v),h.status,h.desc,h.fotos.length,h.id>1e12?new Date(h.id).toLocaleDateString('pt-BR'):'']});
  var ws=XLSX.utils.aoa_to_sheet([cols].concat(linhas)),wb=XLSX.utils.book_new();
  linhas.forEach(function(l,i){ws['D'+(i+2)].z='"R$" #,##0'});
  ws['!cols']=[10,32,16,14,12,11,8,44,30,8,10,7,11,44,7,13].map(function(w){return{wch:w}});
  XLSX.utils.book_append_sheet(wb,ws,'Imóveis');
  return XLSX.write(wb,{type:'array',bookType:'xlsx'})}
function baixar(dados,nome,tipo){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dados],{type:tipo}));a.download=nome;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
$('baixar-planilha').addEventListener('click',function(){
  var lista=visiveis(),f=[$('filtro-st').value,$('filtro-cod').value.trim()].filter(Boolean).join('-');
  if(!lista.length){toast(f?'Nenhum imóvel com esse filtro para baixar.':'Ainda não há imóveis cadastrados para baixar.');return}
  var xlsx=planilha(lista);
  if(!xlsx){toast('Não consegui criar a planilha: abra o painel com internet.');return}
  baixar(xlsx,'planilha.xlsx',XLSX_TIPO)});
$('filtro-st').addEventListener('change',renderAdm);
$('filtro-cod').addEventListener('input',renderAdm);
$('sair').addEventListener('click',function(){nuvemSair().then(function(){location.href='index.html'})});

function go(t){['config','casa','ver'].forEach(function(n){$(n).hidden=n!==t});
  if(t==='casa'&&!editing&&!$('h-cod').value)$('h-cod').value=novoCodigo();
  if(t==='casa')drawMap($('h-end').value,$('h-cep').value);
  try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0)}
/* Sem login, volta para a tela de entrada antes de mostrar qualquer coisa. */
nuvemToken().then(nuvemImoveis).then(function(l){state.houses=l;renderAdm();go(location.hash==='#casa'?'casa':'config')}).catch(function(e){
  if(e.sessao){location.replace('login.html');return}
  go('config');$('nova-casa').hidden=true;$('adm').innerHTML='<div class="empty">Não consegui carregar os imóveis. Confira a internet e abra esta página de novo.</div>'});
</script>
